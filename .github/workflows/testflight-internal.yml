name: Apple release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag to retry
        required: true
        type: string
      upgrade_override_tag:
        description: Confirm the exact release tag to deliberately override upgrade verification
        required: false
        type: string
      upgrade_override_reason:
        description: Reason for the deliberate override (one printable line)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apple-distribution
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  prepare:
    name: Validate GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.revision.outputs.build_number }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel: ${{ steps.release.outputs.channel }}
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
      automation_sha: ${{ steps.automation.outputs.commit_sha }}
      upgrade_sources: ${{ steps.upgrade-plan.outputs.upgrade_sources }}
      upgrade_matrix: ${{ steps.upgrade-plan.outputs.upgrade_matrix }}
      upgrade_overridden: ${{ steps.upgrade-plan.outputs.upgrade_overridden }}
      notes_ios_de_base64: ${{ steps.release.outputs.notes_ios_de_base64 }}
      notes_ios_en_base64: ${{ steps.release.outputs.notes_ios_en_base64 }}
      notes_macos_de_base64: ${{ steps.release.outputs.notes_macos_de_base64 }}
      notes_macos_en_base64: ${{ steps.release.outputs.notes_macos_en_base64 }}
    steps:
      - name: Validate workflow source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            release_fail configuration \
              "Manual retry used ref '$GITHUB_REF'; expected refs/heads/main." \
              "Run the manual Apple release retry from main."
          fi

      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record trusted automation revision
        id: automation
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate scripts
        run: |
          set -euo pipefail
          ruby -c .github/scripts/app_store_connect.rb
          ruby .github/scripts/test_app_store_connect.rb
          ruby -c .github/scripts/release_contract.rb
          ruby .github/scripts/test_release_contract.rb
          ruby -c .github/scripts/release_build_number.rb
          ruby .github/scripts/test_release_build_number.rb
          bash -n .github/scripts/validate_apple_distribution.sh
          bash -n .github/scripts/release_failure.sh

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          tag="${EVENT_TAG:-$REQUESTED_TAG}"
          [[ -n "$tag" ]] || release_fail configuration \
            "The release tag input was empty; expected a published GitHub release tag." \
            "Publish the GitHub release, then run this workflow with its tag."
          api_log="$RUNNER_TEMP/release-api.log"
          if ! retry_command 4 5 "GitHub release metadata request" -- \
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            > "$RUNNER_TEMP/release.json" 2> "$api_log"; then
            api_cause="$(tail -20 "$api_log" 2>/dev/null || true)"
            if grep -qiE 'HTTP 404|Not Found|status 404' <<< "$api_cause"; then
              release_fail metadata \
                "GitHub returned HTTP 404 for release tag '$tag'. The release was deleted or the tag is wrong." \
                "Publish the release again and run this workflow with the published tag."
            elif grep -qiE 'rate limit|HTTP 5[0-9][0-9]|502|503|504' <<< "$api_cause"; then
              release_fail github-outage \
                "GitHub release metadata request failed after retries: $api_cause" \
                "Re-run the workflow later after the GitHub outage or rate limit clears."
            else
              release_fail metadata \
                "GitHub release metadata request failed after retries: $api_cause" \
                "Verify the tag and GitHub token permissions, then re-run the workflow."
            fi
          fi
          ruby .github/scripts/release_contract.rb \
            "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/apple-release-notes"

      - name: Verify and record release commit
        id: revision
        env:
          AUTOMATION_SHA: ${{ steps.automation.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_sha" "$AUTOMATION_SHA" || release_fail configuration \
            "The release tag must point to a commit on main. Tag '$RELEASE_TAG' resolves to '$release_sha', which is not an ancestor of trusted automation '$AUTOMATION_SHA'." \
            "Publish the release from a commit on main and retry."
          echo "commit_sha=$release_sha" >> "$GITHUB_OUTPUT"
          ruby .github/scripts/release_build_number.rb "$release_sha" "$RUNNER_TEMP/release.json"

      - name: Select published upgrade sources
        id: upgrade-plan
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_TAG: ${{ inputs.upgrade_override_tag }}
          OVERRIDE_REASON: ${{ inputs.upgrade_override_reason }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-pages.json"
          python3 -c 'import json,sys; print(json.dumps([release for page in json.load(open(sys.argv[1])) for release in page]))' \
            "$RUNNER_TEMP/release-pages.json" > "$RUNNER_TEMP/release-history.json"
          python3 .github/scripts/release_upgrade.py \
            --release "$RUNNER_TEMP/release.json" --history "$RUNNER_TEMP/release-history.json" \
            --output "$RUNNER_TEMP/upgrade-plan.json" --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --override-tag="$OVERRIDE_TAG" --override-reason="$OVERRIDE_REASON"

      - name: Check out the exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

  in-app-purchase-preflight:
    name: Validate StoreKit sandbox metadata
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testflight-internal
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Validate App Store Connect products
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_connect.rb validate-sandbox-in-app-purchases
          ruby .github/scripts/app_store_connect.rb validate-build-number \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare, in-app-purchase-preflight]
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight-internal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            api_platform: IOS
            script_platform: ios
            scheme: EncryptedMemoriesMobile
            sdk: iphoneos
            destination: generic/platform=iOS
            profile_platform: ios
            profile_name: Encrypted Memories iOS App Store
            profile_app_identifier_key: application-identifier
            profile_expected_platform: iOS
          - platform: macOS
            api_platform: MAC_OS
            script_platform: macos
            scheme: EncryptedMemories
            sdk: macosx
            destination: generic/platform=macOS
            profile_platform: macos
            profile_name: Encrypted Memories macOS App Store
            profile_app_identifier_key: com.apple.application-identifier
            profile_expected_platform: OSX
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out release revision
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          actual_release_sha="$(git rev-parse HEAD)"
          [[ "$actual_release_sha" == "$EXPECTED_RELEASE_SHA" ]] || release_fail configuration \
            "Checked out release '$actual_release_sha'; expected '$EXPECTED_RELEASE_SHA'." \
            "Re-run with the validated release commit and trusted checkout."

      - name: Record Apple toolchain diagnostics
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          macos_version="$(sw_vers)"
          printf '%s\n%s\n' "$xcode_version" "$macos_version"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## Apple build toolchain"
              echo '```text'
              printf '%s\n%s\n' "$xcode_version" "$macos_version"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for an existing upload
        id: build
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          for secret_name in APP_STORE_CONNECT_APP_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            [[ -n "${!secret_name:-}" ]] || release_fail configuration \
              "Secret or variable $secret_name was empty." \
              "Set $secret_name in the testflight-internal environment and re-run the workflow."
          done
          ruby .github/scripts/app_store_connect.rb inspect-build \
            --platform "${{ matrix.api_platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Validate existing build state
        env:
          PROCESSING_STATE: ${{ steps.build.outputs.processing_state }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          case "$PROCESSING_STATE" in
            FAILED|INVALID)
              release_fail app-store-connect \
                "App Store Connect reported processing state '$PROCESSING_STATE' for this build number." \
                "Start a new workflow run with a new build number after correcting the Apple rejection."
              ;;
          esac

      - name: Decode Apple distribution certificate archive
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_SIGNING_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12_BASE64 }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          [[ -n "${APPLE_SIGNING_CERTIFICATES_P12_BASE64:-}" ]] || release_fail configuration \
            "Secret APPLE_SIGNING_CERTIFICATES_P12_BASE64 was empty." \
            "Set APPLE_SIGNING_CERTIFICATES_P12_BASE64 to the base64 P12 archive."
          certificate_archive="$RUNNER_TEMP/apple-signing-certificates.p12"
          if ! ruby -rbase64 -e '
            File.binwrite(
              ARGV.fetch(0),
              Base64.strict_decode64(ENV.fetch("APPLE_SIGNING_CERTIFICATES_P12_BASE64"))
            )
          ' "$certificate_archive"; then
            release_fail configuration \
              "Secret APPLE_SIGNING_CERTIFICATES_P12_BASE64 could not be decoded into a P12 archive." \
              "Export the certificate archive again, base64-encode it, and update APPLE_SIGNING_CERTIFICATES_P12_BASE64."
          fi
          chmod 600 "$certificate_archive"

      - name: Import certificates with pinned community action
        id: import-certificates
        if: steps.build.outputs.exists != 'true'
        continue-on-error: true
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: encrypted_memories_signing
          p12-filepath: ${{ runner.temp }}/apple-signing-certificates.p12
          p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}

      - name: Verify imported certificate archive
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}
          IMPORT_OUTCOME: ${{ steps.import-certificates.outcome }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          [[ -n "${APPLE_SIGNING_CERTIFICATES_PASSWORD:-}" ]] || release_fail configuration \
            "Secret APPLE_SIGNING_CERTIFICATES_PASSWORD was empty." \
            "Export the certificate archive again and update APPLE_SIGNING_CERTIFICATES_PASSWORD."
          # Judge the keychain import itself. OpenSSL 3 rejects the legacy encryption of Keychain-exported
          # archives that `security import` accepts, so a second parser reported valid credentials as wrong.
          if [[ "$IMPORT_OUTCOME" != "success" ]]; then
            release_fail credentials \
              "The P12 archive could not be imported with APPLE_SIGNING_CERTIFICATES_PASSWORD." \
              "Export the certificate again and update APPLE_SIGNING_CERTIFICATES_P12_BASE64 and APPLE_SIGNING_CERTIFICATES_PASSWORD."
          fi

      - name: Resolve imported signing identities
        id: signing-identities
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          SCRIPT_PLATFORM: ${{ matrix.script_platform }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          identities_path="$RUNNER_TEMP/signing-identities.txt"
          if ! security find-identity -v encrypted_memories_signing.keychain > "$identities_path" 2>&1; then
            release_fail credentials \
              "The signing keychain could not be inspected for $SCRIPT_PLATFORM." \
              "Import a valid certificate archive and update APPLE_SIGNING_CERTIFICATES_P12_BASE64."
          fi
          set +e
          identity_log="$RUNNER_TEMP/signing-identities.log"
          ruby - "$identities_path" <<'RUBY' 2>"$identity_log"
          path = ARGV.fetch(0)
          team_id = ENV.fetch("APPLE_DEVELOPER_TEAM_ID")
          platform = ENV.fetch("SCRIPT_PLATFORM")
          identities = []

          File.foreach(path) do |line|
            match = line.match(/^\s*\d+\)\s+([0-9A-F]{40})\s+"([^"]+)"\s*$/)
            identities << [match[1], match[2]] if match
          end
          identities.uniq!

          team_suffix = "(#{team_id})"
          distribution = identities.filter_map do |fingerprint, name|
            fingerprint if name.start_with?("Apple Distribution:") && name.end_with?(team_suffix)
          end.uniq
          installer = identities.filter_map do |fingerprint, name|
            legacy = name.start_with?("3rd Party Mac Developer Installer:")
            current = name.start_with?("Mac Installer Distribution:")
            fingerprint if (legacy || current) && name.end_with?(team_suffix)
          end.uniq

          abort "Expected one Apple Distribution identity, found #{distribution.length}." unless distribution.one?
          if platform == "macos" && !installer.one?
            abort "Expected one Mac App Store installer identity, found #{installer.length}."
          end

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("distribution_sha1=#{distribution.first}")
            output.puts("installer_sha1=#{installer.first}") if platform == "macos"
          end
          RUBY
          identity_status=$?
          set -e
          if (( identity_status != 0 )); then
            identity_output="$(cat "$identity_log" 2>/dev/null || true)"
            release_fail credentials \
              "Signing identity check failed: $identity_output" \
              "Import exactly one Apple Distribution identity for APPLE_DEVELOPER_TEAM_ID and update the named certificate secret."
          fi
          rm -f "$identities_path"
          distribution_sha1="$(sed -n 's/^distribution_sha1=//p' "$GITHUB_OUTPUT" | tail -1)"
          installer_sha1="$(sed -n 's/^installer_sha1=//p' "$GITHUB_OUTPUT" | tail -1)"
          cert_pem="$RUNNER_TEMP/signing-certificates.pem"
          if ! security find-certificate -a -p encrypted_memories_signing.keychain > "$cert_pem" 2>/dev/null; then
            release_fail credentials \
              "The imported signing certificates could not be read from encrypted_memories_signing." \
              "Export the certificate again and update APPLE_SIGNING_CERTIFICATES_P12_BASE64."
          fi
          set +e
          certificate_output="$(CERT_PEM="$cert_pem" DISTRIBUTION_SHA1="$distribution_sha1" INSTALLER_SHA1="$installer_sha1" \
            ruby -ropenssl -rtime <<'RUBY'
          pem = File.read(ENV.fetch("CERT_PEM"))
          selected = [ENV.fetch("DISTRIBUTION_SHA1"), ENV["INSTALLER_SHA1"]].compact.reject(&:empty?)
          certificates = pem.scan(/-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----/m).map do |value|
            OpenSSL::X509::Certificate.new(value)
          end
          matches = certificates.select { |certificate| selected.include?(OpenSSL::Digest::SHA1.hexdigest(certificate.to_der).upcase) }
          abort "No imported certificate matched the selected signing identity." if matches.empty?
          matches.each do |certificate|
            expiry = certificate.not_after
            label = OpenSSL::Digest::SHA1.hexdigest(certificate.to_der).upcase
            if expiry <= Time.now
              abort "Certificate #{label} expired on #{expiry.utc.iso8601}."
            elsif expiry <= Time.now + (14 * 86_400)
              puts "::warning title=Apple signing certificate expires soon::Certificate #{label} expires on #{expiry.utc.iso8601}; renew it within 14 days."
            end
            puts "Signing certificate #{label} expires on #{expiry.utc.iso8601}."
          end
          RUBY
          )"
          certificate_status=$?
          set -e
          if (( certificate_status != 0 )); then
            release_fail credentials \
              "An imported signing certificate is expired or could not be checked: $certificate_output" \
              "Renew the certificate, export it again, and update APPLE_SIGNING_CERTIFICATES_P12_BASE64."
          fi
          echo "Validated the imported distribution identities."

      - name: Create or install App Store provisioning profile
        id: profile
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          PROFILE_APP_IDENTIFIER_KEY: ${{ matrix.profile_app_identifier_key }}
          PROFILE_EXPECTED_PLATFORM: ${{ matrix.profile_expected_platform }}
          PROFILE_NAME: ${{ matrix.profile_name }}
          PROFILE_PLATFORM: ${{ matrix.profile_platform }}
          FASTLANE_DISABLE_COLORS: "1"
          FASTLANE_HIDE_TIMESTAMP: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_MIN_VERSION: "2.237.0"
          FASTLANE_MAX_VERSION: "3.0.0"
          SIGH_IGNORE_PROFILES_WITH_DIFFERENT_NAME: "true"
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          for secret_name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64 APPLE_DEVELOPER_TEAM_ID DISTRIBUTION_SHA1 PROFILE_NAME; do
            [[ -n "${!secret_name:-}" ]] || release_fail configuration \
              "Secret or signing value $secret_name was empty." \
              "Set $secret_name in the testflight-internal environment and re-run the workflow."
          done
          api_key_path="$RUNNER_TEMP/app-store-connect-api-key.json"
          profile_output="$RUNNER_TEMP/provisioning-profile"
          mkdir -p "$profile_output"
          if ! ruby -rbase64 -rjson -ropenssl -e '
            key = Base64.strict_decode64(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY_BASE64"))
            OpenSSL::PKey.read(key)
            File.write(
              ARGV.fetch(0),
              JSON.generate(
                key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
                key: key,
                in_house: false
              )
            )
          ' "$api_key_path"; then
            release_fail credentials \
              "The App Store Connect private key from APP_STORE_CONNECT_PRIVATE_KEY_BASE64 was invalid." \
              "Create a new App Store Connect API key and update APP_STORE_CONNECT_PRIVATE_KEY_BASE64."
          fi
          chmod 600 "$api_key_path"

          actual_fastlane_version="$(
            fastlane --version 2>&1 \
              | awk '/^fastlane [0-9]+\./ { print $2 }' \
              | tail -1
          )"
          [[ -n "$actual_fastlane_version" ]] || release_fail toolchain \
            "The installed fastlane version could not be determined." \
            "Install the pinned fastlane version on the xcode-27 runner."
          if ! ruby -rrubygems -e '
            version = Gem::Version.new(ARGV.fetch(0))
            requirement = Gem::Requirement.new(
              ">= #{ENV.fetch("FASTLANE_MIN_VERSION")}",
              "< #{ENV.fetch("FASTLANE_MAX_VERSION")}"
            )
            abort "Expected fastlane #{requirement}, found #{version}." unless requirement.satisfied_by?(version)
          ' "$actual_fastlane_version"; then
            release_fail toolchain \
              "Installed fastlane version '$actual_fastlane_version' was outside the supported range $FASTLANE_MIN_VERSION to $FASTLANE_MAX_VERSION." \
              "Install a fastlane version in the supported range on the xcode-27 runner."
          fi
          echo "Using compatible fastlane $actual_fastlane_version."
          if ! retry_command 3 15 "fastlane provisioning profile request" -- fastlane sigh \
            --api_key_path "$api_key_path" \
            --app_identifier at.oncloud.encryptedmemories \
            --force \
            --team_id "$APPLE_DEVELOPER_TEAM_ID" \
            --platform "$PROFILE_PLATFORM" \
            --provisioning_name "$PROFILE_NAME" \
            --output_path "$profile_output"; then
            release_fail credentials \
              "fastlane could not create or download provisioning profile '$PROFILE_NAME'." \
              "Renew the profile and verify APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_PRIVATE_KEY_BASE64, and APPLE_DEVELOPER_TEAM_ID."
          fi

          shopt -s nullglob
          profiles=("$profile_output"/*)
          [[ "${#profiles[@]}" -eq 1 ]] || release_fail signing \
            "Checked downloaded provisioning profiles; actual count was ${#profiles[@]}; expected exactly 1." \
            "Renew the named provisioning profile and remove stale profiles from the App Store Connect account."
          profile_plist="$RUNNER_TEMP/provisioning-profile.plist"
          if ! security cms -D -i "${profiles[0]}" > "$profile_plist" 2>"$RUNNER_TEMP/profile-decode.log"; then
            release_fail signing \
              "The downloaded provisioning profile could not be decoded: $(tail -20 "$RUNNER_TEMP/profile-decode.log")" \
              "Renew the named provisioning profile and retry the workflow."
          fi
          if ! plutil -lint "$profile_plist" >/dev/null 2>"$RUNNER_TEMP/profile-lint.log"; then
            release_fail signing \
              "The downloaded provisioning profile plist was invalid: $(tail -20 "$RUNNER_TEMP/profile-lint.log")" \
              "Renew the named provisioning profile and retry the workflow."
          fi

          read_profile_value() {
            local label="$1" remediation="$2"
            shift 2
            local output
            if ! output="$("$@" 2>&1)"; then
              release_fail signing \
                "Checked $label; actual command failed: $output" "$remediation"
            fi
            printf '%s' "$output"
          }
          actual_name="$(read_profile_value "profile name" "Renew the named provisioning profile." plutil -extract Name raw -o - "$profile_plist")"
          actual_team="$(read_profile_value "profile team" "Renew the provisioning profile for the configured Apple team." plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          actual_app_identifier="$(read_profile_value "profile application identifier" "Renew the profile for the configured bundle identifier." \
            /usr/libexec/PlistBuddy -c "Print :Entitlements:$PROFILE_APP_IDENTIFIER_KEY" "$profile_plist")"
          expiration="$(read_profile_value "profile expiration" "Renew the named provisioning profile." plutil -extract ExpirationDate raw -o - "$profile_plist")"
          xcode_managed="$(plutil -extract IsXcodeManaged raw -o - "$profile_plist" 2>/dev/null || true)"
          platforms="$(read_profile_value "profile platforms" "Renew the provisioning profile for the required platform." plutil -extract Platform json -o - "$profile_plist")"

          [[ "$actual_name" == "$PROFILE_NAME" ]] || release_fail signing \
            "Checked provisioning profile name; actual value was '$actual_name'; expected '$PROFILE_NAME'." \
            "Renew and select the named provisioning profile."
          [[ "$actual_team" == "$APPLE_DEVELOPER_TEAM_ID" ]] || release_fail signing \
            "Checked provisioning profile team; actual value was '$actual_team'; expected '$APPLE_DEVELOPER_TEAM_ID'." \
            "Renew the profile for the configured Apple team."
          [[ "$actual_app_identifier" == "$APPLE_DEVELOPER_TEAM_ID.at.oncloud.encryptedmemories" ]] || release_fail signing \
            "Checked provisioning profile application identifier; actual value was '$actual_app_identifier'; expected '$APPLE_DEVELOPER_TEAM_ID.at.oncloud.encryptedmemories'." \
            "Renew the profile for at.oncloud.encryptedmemories."
          [[ "$xcode_managed" != "true" ]] || {
            release_fail signing \
              "Checked IsXcodeManaged; actual value was true; expected false for manual signing." \
              "Create a non-Xcode-managed App Store provisioning profile."
          }
          if ! jq -e --arg platform "$PROFILE_EXPECTED_PLATFORM" \
            'index($platform) != null' <<< "$platforms" >/dev/null; then
            release_fail signing \
              "Checked provisioning profile platforms; actual value was '$platforms'; expected '$PROFILE_EXPECTED_PLATFORM'." \
              "Renew the provisioning profile for the required platform."
          fi
          expiration_epoch="$(ruby -rtime -e 'puts Time.parse(ARGV.fetch(0)).to_i' "$expiration")"
          now_epoch="$(date +%s)"
          if (( expiration_epoch <= now_epoch )); then
            release_fail credentials \
              "Provisioning profile '$PROFILE_NAME' expired on $expiration." \
              "Renew the provisioning profile and update the App Store Connect profile configuration."
          elif (( expiration_epoch <= now_epoch + 14 * 86400 )); then
            echo "::warning title=Provisioning profile expires soon::Profile '$PROFILE_NAME' expires on $expiration; renew it within 14 days."
          fi

          profile_certificate="$RUNNER_TEMP/provisioning-profile-certificate.der"
          profile_certificate_count=0
          profile_certificate_matches=0
          while profile_certificate_data="$(
            plutil -extract "DeveloperCertificates.$profile_certificate_count" \
              raw -o - "$profile_plist" 2>/dev/null
          )"; do
            printf '%s' "$profile_certificate_data" \
              | base64 --decode > "$profile_certificate"
            profile_certificate_sha1="$(
              openssl x509 -inform DER -in "$profile_certificate" -noout -fingerprint -sha1 \
                | awk -F= '{ print $2 }' \
                | tr -d ':'
            )"
            if [[ "$profile_certificate_sha1" == "$DISTRIBUTION_SHA1" ]]; then
              profile_certificate_matches="$((profile_certificate_matches + 1))"
            fi
            profile_certificate_count="$((profile_certificate_count + 1))"
          done
          (( profile_certificate_count > 0 )) || release_fail signing \
            "Checked provisioning profile DeveloperCertificates; actual count was 0; expected at least 1." \
            "Renew the provisioning profile with the distribution certificate."
          (( profile_certificate_matches == 1 )) || release_fail signing \
            "Checked provisioning profile certificate matches; actual count was $profile_certificate_matches; expected exactly 1." \
            "Renew the profile and export the matching distribution certificate again."

          echo "name=$actual_name" >> "$GITHUB_OUTPUT"
          echo "Installed $actual_name, valid until $expiration."

      - uses: ./.github/actions/prepare-apple-build
        id: apple-build
        if: steps.build.outputs.exists != 'true'

      - name: Create manual export options
        id: export-options
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          INSTALLER_SHA1: ${{ steps.signing-identities.outputs.installer_sha1 }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          for signing_value in APPLE_DEVELOPER_TEAM_ID DISTRIBUTION_SHA1 PROFILE_NAME; do
            [[ -n "${!signing_value:-}" ]] || release_fail signing \
              "Signing value $signing_value was empty." \
              "Import the signing assets and provisioning profile before creating export options."
          done
          options="$RUNNER_TEMP/ExportOptions-${{ matrix.script_platform }}.plist"
          plutil -create xml1 "$options"
          plutil -insert destination -string export "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert provisioningProfiles -xml \
            "<dict><key>at.oncloud.encryptedmemories</key><string>$PROFILE_NAME</string></dict>" \
            "$options"
          plutil -insert signingCertificate -string "$DISTRIBUTION_SHA1" "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert stripSwiftSymbols -bool true "$options"
          plutil -insert teamID -string "$APPLE_DEVELOPER_TEAM_ID" "$options"
          plutil -insert uploadSymbols -bool true "$options"
          if [[ "${{ matrix.script_platform }}" == "macos" ]]; then
            [[ -n "${INSTALLER_SHA1:-}" ]] || release_fail signing \
              "Signing value INSTALLER_SHA1 was empty for macOS." \
              "Import the Mac Installer Distribution certificate and update the certificate secret."
            plutil -insert installerSigningCertificate \
              -string "$INSTALLER_SHA1" \
              "$options"
          fi
          plutil -lint "$options"
          echo "path=$options" >> "$GITHUB_OUTPUT"

      - name: Archive with Xcode
        id: archive
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          SOURCE_PACKAGES_PATH: ${{ steps.apple-build.outputs.source-packages-path }}
          PACKAGE_CACHE_PATH: ${{ steps.apple-build.outputs.package-cache-path }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          archive_path="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.xcarchive"
          derived_data="$RUNNER_TEMP/DerivedData-${{ matrix.script_platform }}.noindex"
          result_bundle="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.xcresult"
          log_path="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.log"
          if ! xcrun xcodebuild archive \
            -project EncryptedMemories.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data" \
            -resultBundlePath "$result_bundle" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -packageCachePath "$PACKAGE_CACHE_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM_ID" \
            MARKETING_VERSION="$APPLE_RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$APPLE_BUILD_NUMBER" \
            ENCRYPTED_MEMORIES_BUILD_COMMIT="${{ needs.prepare.outputs.commit_sha }}" \
            ENCRYPTED_MEMORIES_PROTON_CHANNEL="${{ needs.prepare.outputs.prerelease == 'true' && 'beta' || 'stable' }}" \
            ENCRYPTED_MEMORIES_CODE_SIGN_STYLE=Manual \
            ENCRYPTED_MEMORIES_CODE_SIGN_IDENTITY="$DISTRIBUTION_SHA1" \
            ENCRYPTED_MEMORIES_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$log_path"; then
            archive_cause="$(tail -20 "$log_path" 2>/dev/null || true)"
            release_fail build \
              "xcodebuild archive failed for ${{ matrix.platform }}: $archive_cause" \
              "Inspect the retained Xcode log, correct the reported build or signing cause, and re-run the failed job."
          fi
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "log-path=$log_path" >> "$GITHUB_OUTPUT"

      - name: Export App Store package with Xcode
        id: export
        if: steps.build.outputs.exists != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          EXPORT_OPTIONS_PATH: ${{ steps.export-options.outputs.path }}
          ARCHIVE_LOG_PATH: ${{ steps.archive.outputs.log-path }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          export_path="$RUNNER_TEMP/export-${{ matrix.script_platform }}"
          if ! xcrun xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            2>&1 | tee -a "$ARCHIVE_LOG_PATH"; then
            export_cause="$(tail -20 "$ARCHIVE_LOG_PATH" 2>/dev/null || true)"
            release_fail build \
              "xcodebuild export failed for ${{ matrix.platform }}: $export_cause" \
              "Inspect the retained Xcode log, correct the reported export or signing cause, and re-run the failed job."
          fi
          echo "path=$export_path" >> "$GITHUB_OUTPUT"

      - name: Validate signed archive and export
        id: artifact
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          bash .github/scripts/validate_apple_distribution.sh \
            "${{ matrix.script_platform }}" \
            "${{ steps.archive.outputs.path }}" \
            "${{ steps.export.outputs.path }}" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ steps.profile.outputs.name }}"

      - name: Retain validated package for gated upload
        if: steps.build.outputs.exists != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-package-${{ matrix.script_platform }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-signing-certificates.p12"
          rm -f "$RUNNER_TEMP/app-store-connect-api-key.json"
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys"

      - name: Retain build diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-${{ matrix.script_platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EncryptedMemories-${{ matrix.script_platform }}.log
            ${{ runner.temp }}/EncryptedMemories-${{ matrix.script_platform }}.xcresult
            ${{ runner.temp }}/altool-upload-${{ matrix.script_platform }}-attempt-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Report build storage
        if: always()
        run: bash ./scripts/report-build-storage.sh

  upgrade:
    name: Test installed upgrades on ${{ matrix.platform }} (${{ matrix.shard }})
    needs: [prepare, build]
    runs-on: xcode-27
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The prepare job builds the jobs from the one list of interruption points and the selected sources
      # (.github/scripts/release_upgrade.py): each platform tests every source, together its jobs cover every
      # point once, and each job fits its time budget. A new point or source needs no edit here.
      matrix: ${{ fromJSON(needs.prepare.outputs.upgrade_matrix) }}
    env:
      # The lines that tell each case's result, timing and free disk. GitHub cuts a step log at about 10 MB, so the
      # journey step prints only these lines; the full output stays in the retained release-upgrade.log.
      JOURNEY_LINES: '^(PASS |\*\*Upgrade check failed|(iOS|macOS) (old|new) bundle: |Free disk |Xcode toolchain: |Owned iOS Simulator: )|: the UI run |: case took | error: |\*\* (BUILD|TEST) (FAILED|INTERRUPTED) \*\*'
    steps:
      - name: Report upgrade check scope
        if: always()
        run: |
          {
            echo 'macOS-Keychain-Persistenz über das Update wird nicht im Prüfbau geprüft; abgedeckt durch iOS-Simulator und Entitlement-Vergleich.'
            echo 'The backup journey requires consent already saved on disk. The immediate v1.0.5 Enable-to-SIGKILL case is a known historical limit and is not tested here.'
            echo 'The gate requires installed CFBundleShortVersionString and CFBundleVersion to equal the published release data string-for-string before every old and new probe starts. External authentication-header acceptance remains unverified.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted upgrade automation
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: python
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'

      - name: Install pinned XcodeGen
        id: xcodegen
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        run: |
          set -euo pipefail
          executable="$(bash scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-install")"
          dirname "$executable" >> "$GITHUB_PATH"
          "$executable" --version

      - name: Record upgrade toolchain
        id: toolchain
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        run: |
          set -euo pipefail
          # The reviewed pins are the defaults of the prepare-apple-build action; read them from there.
          pin() {
            ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).fetch("inputs").fetch(ARGV[1]).fetch("default")' \
              .github/actions/prepare-apple-build/action.yml "$1"
          }
          EXPECTED_XCODE_VERSION="$(pin xcode-version)" EXPECTED_XCODE_BUILD="$(pin xcode-build)" \
            bash .github/scripts/verify_xcode_toolchain.sh
          echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)-$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Report runner disk
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        run: |
          # An iOS shard ran out of disk (rehearsal 38181793360). The free space at the start bounds every case.
          { echo '### Runner disk at job start'; echo '```'; df -h "$HOME"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore completed predecessor builds
        id: cache
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Developer/xcode/EncryptedMemories/UpgradeCheck/products
          key: release-upgrade-${{ matrix.platform }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/upgrade-test/build_apps.py', '.github/scripts/release_identity.rb', '.github/scripts/release_build_number.rb', 'scripts/upgrade-test/overlays/**', 'Packages/EncryptedMemoriesKit/Sources/**/UpgradeTest*.swift') }}-${{ needs.prepare.outputs.tag }}
          restore-keys: |
            release-upgrade-${{ matrix.platform }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/upgrade-test/build_apps.py', '.github/scripts/release_identity.rb', '.github/scripts/release_build_number.rb', 'scripts/upgrade-test/overlays/**', 'Packages/EncryptedMemoriesKit/Sources/**/UpgradeTest*.swift') }}-

      - name: Test installed upgrades
        id: journey
        if: needs.prepare.outputs.upgrade_overridden != 'true'
        env:
          TARGET_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          TARGET_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          UPGRADE_SOURCES: ${{ needs.prepare.outputs.upgrade_sources }}
          UPGRADE_PLATFORM: ${{ matrix.platform }}
          UPGRADE_POINTS: ${{ matrix.points }}
        run: |
          set -euo pipefail
          mapfile_path="$RUNNER_TEMP/upgrade-sources.txt"
          python3 -c 'import json,os; print("\n".join(json.loads(os.environ["UPGRADE_SOURCES"])))' > "$mapfile_path"
          sources=()
          while IFS= read -r tag; do [[ -z "$tag" ]] || sources+=("$tag"); done < "$mapfile_path"
          [[ "${#sources[@]}" -gt 0 ]] || { echo "::error::No supported upgrade source selected"; exit 1; }
          read -ra points <<< "$UPGRADE_POINTS"
          [[ "${#points[@]}" -gt 0 ]] || { echo "::error::No interruption point selected"; exit 1; }
          bash scripts/test-release-upgrade.sh --target "$TARGET_COMMIT" --release-tag "$TARGET_RELEASE_TAG" --sources "${sources[@]}" --platform "$UPGRADE_PLATFORM" --points "${points[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/release-upgrade.log" | { grep --line-buffered -aE "$JOURNEY_LINES" || true; }

      - name: List upgrade results
        if: always() && needs.prepare.outputs.upgrade_overridden != 'true'
        run: |
          # GitHub cuts the journey step log at about 10 MB inside the build output. This short step keeps each
          # case result, the UI runner startup times, and the failure cause readable.
          grep -aE "$JOURNEY_LINES" "$RUNNER_TEMP/release-upgrade.log" || echo 'The journey recorded no case result.'
          { echo '### Runner disk at job end'; echo '```'; df -h "$HOME"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report blocked release
        if: failure() || cancelled()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          XCODEGEN_OUTCOME: ${{ steps.xcodegen.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        run: |
          {
            echo 'Both Apple uploads remain blocked. Correct the failed step and re-run, or use the explicit main-branch override.'
            echo "Checkout: $CHECKOUT_OUTCOME; Python: $PYTHON_OUTCOME; XcodeGen: $XCODEGEN_OUTCOME; toolchain: $TOOLCHAIN_OUTCOME; cache: $CACHE_OUTCOME; journey: $JOURNEY_OUTCOME."
            echo 'The journey log reports the failing source, task boundary, and cause. Retained evidence contains the UI logs and result bundles.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deliberate upgrade override
        if: needs.prepare.outputs.upgrade_overridden == 'true'
        run: echo 'The maintainer deliberately overrode this gate. The tag and reason are recorded in the release preparation summary.' >> "$GITHUB_STEP_SUMMARY"

      - name: Retain upgrade evidence
        if: always() && needs.prepare.outputs.upgrade_overridden != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-upgrade-${{ matrix.platform }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Developer/xcode/EncryptedMemories/UpgradeCheck/evidence
            ${{ runner.temp }}/release-upgrade.log
          if-no-files-found: warn
          retention-days: 14

  upload:
    name: Upload ${{ matrix.platform }}
    needs: [prepare, build, upgrade]
    runs-on: xcode-27
    timeout-minutes: 30
    environment: testflight-internal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            api_platform: IOS
            script_platform: ios
          - platform: macOS
            api_platform: MAC_OS
            script_platform: macos
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Check for an existing upload
        id: build
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          for secret_name in APP_STORE_CONNECT_APP_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            [[ -n "${!secret_name:-}" ]] || release_fail configuration \
              "Secret or variable $secret_name was empty." \
              "Set $secret_name in the testflight-internal environment and re-run the workflow."
          done
          ruby .github/scripts/app_store_connect.rb inspect-build \
            --platform "${{ matrix.api_platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Validate existing build state
        env:
          PROCESSING_STATE: ${{ steps.build.outputs.processing_state }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          case "$PROCESSING_STATE" in
            FAILED|INVALID)
              release_fail app-store-connect \
                "App Store Connect reported processing state '$PROCESSING_STATE' for this build number." \
                "Start a new workflow run with a new build number after correcting the Apple rejection."
              ;;
          esac

      - name: Restore validated package
        if: steps.build.outputs.exists != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-package-${{ matrix.script_platform }}
          path: ${{ runner.temp }}/validated-package

      - name: Resolve validated package path
        id: artifact
        if: steps.build.outputs.exists != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP/validated-package"/*.ipa "$RUNNER_TEMP/validated-package"/*.pkg)
          [[ "${#packages[@]}" -eq 1 ]] || { echo "::error::Expected exactly one validated package"; exit 1; }
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload package to App Store Connect
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          for secret_name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            [[ -n "${!secret_name:-}" ]] || release_fail configuration \
              "Secret $secret_name was empty." \
              "Set $secret_name in the testflight-internal environment and re-run the workflow."
          done
          [[ -n "${ARTIFACT_PATH:-}" ]] || release_fail configuration \
            "The validated upload artifact path was empty." \
            "Complete archive, export, and validation before uploading the package."
          private_key_directory="$RUNNER_TEMP/app-store-connect-private-keys"
          private_key="$private_key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$private_key_directory"
          if ! ruby -rbase64 -e '
            File.binwrite(
              ARGV.fetch(0),
              Base64.strict_decode64(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY_BASE64"))
            )
          ' "$private_key"; then
            release_fail credentials \
              "Secret APP_STORE_CONNECT_PRIVATE_KEY_BASE64 could not be decoded." \
              "Create a valid App Store Connect API key and update APP_STORE_CONNECT_PRIVATE_KEY_BASE64."
          fi
          chmod 600 "$private_key"
          if ! openssl pkey -in "$private_key" -noout >/dev/null 2>&1; then
            release_fail credentials \
              "The App Store Connect private key from APP_STORE_CONNECT_PRIVATE_KEY_BASE64 was not a valid P8 key." \
              "Create a new App Store Connect API key and update APP_STORE_CONNECT_PRIVATE_KEY_BASE64."
          fi
          altool_attempt=0
          run_altool_upload() {
            local upload_log altool_status
            altool_attempt=$((altool_attempt + 1))
            local attempt="$altool_attempt"
            upload_log="$RUNNER_TEMP/altool-upload-${{ matrix.script_platform }}-attempt-${attempt}.log"
            xcrun altool --upload-package "$ARTIFACT_PATH" \
              --api-key "$APP_STORE_CONNECT_KEY_ID" \
              --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --p8-file-path "$private_key" \
              --show-progress \
              --output-format json 2>&1 | tee "$upload_log"
            altool_status="${PIPESTATUS[0]}"
            if [[ "$altool_status" -eq 0 ]]; then
              return 0
            fi
            if grep -qiE 'ITMS-90189|Redundant Binary Upload|already uploaded|already exists' "$upload_log"; then
              echo "::notice::App Store Connect already holds this build; treating the upload as complete."
              return 0
            fi
            return "$altool_status"
          }
          if ! retry_command 4 30 "xcrun altool upload" -- run_altool_upload; then
            last_log="$RUNNER_TEMP/altool-upload-${{ matrix.script_platform }}-attempt-4.log"
            last_output="$(tail -20 "$last_log" 2>/dev/null | sed 's/^/\"/; s/$/\"/' || true)"
            if grep -qiE 'authentication|unauthorized|invalid .*key|invalid issuer|401|403|JWT|credentials' "$last_log" 2>/dev/null; then
              release_fail credentials \
                "App Store Connect authentication failed. Last altool output: $last_output" \
                "Verify APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_PRIVATE_KEY_BASE64, then update those named secrets."
            else
              release_fail upload \
                "xcrun altool failed after 4 attempts. Last 20 altool output lines: $last_output" \
                "Re-run the workflow for transient Defaults.properties, network, timeout, 5xx, or unknown runner failures; inspect the retained altool log if it persists."
            fi
          fi

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-signing-certificates.p12"
          rm -f "$RUNNER_TEMP/app-store-connect-api-key.json"
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys"

      - name: Retain upload diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-upload-${{ matrix.script_platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/altool-upload-${{ matrix.script_platform }}-attempt-*.log
          if-no-files-found: warn
          retention-days: 14

  distribute:
    name: Add to internal TestFlight
    needs: [prepare, upload]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: testflight-internal
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Restore localized Apple notes
        env:
          NOTES_IOS_DE_BASE64: ${{ needs.prepare.outputs.notes_ios_de_base64 }}
          NOTES_IOS_EN_BASE64: ${{ needs.prepare.outputs.notes_ios_en_base64 }}
          NOTES_MACOS_DE_BASE64: ${{ needs.prepare.outputs.notes_macos_de_base64 }}
          NOTES_MACOS_EN_BASE64: ${{ needs.prepare.outputs.notes_macos_en_base64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-release-notes"
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" NOTES_IOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" NOTES_IOS_EN_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" NOTES_MACOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" NOTES_MACOS_EN_BASE64

      - name: Wait for Apple and distribute the builds
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          apple_log="$RUNNER_TEMP/apple-distribute.log"
          if ! ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" 2>&1 | tee "$apple_log"; then
            release_fail app-store-connect \
              "App Store Connect build processing failed: $(tail -20 "$apple_log")" \
              "Confirm the builds exist and are valid in App Store Connect, then re-run after any Apple outage clears."
          fi

          if ! ruby .github/scripts/app_store_connect.rb distribute-internal \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --localization "IOS:de-DE=$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" \
            --localization "IOS:en-US=$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" \
            --localization "MAC_OS:de-DE=$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" \
            --localization "MAC_OS:en-US=$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" 2>&1 | tee -a "$apple_log"; then
            release_fail app-store-connect \
              "Internal TestFlight distribution failed: $(tail -20 "$apple_log")" \
              "Verify the localized release notes and App Store Connect state, then re-run after any Apple outage clears."
          fi

  submit-app-store:
    name: Submit iOS and macOS to App Review
    needs: [prepare, upload]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: app-store-production
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Restore localized Apple notes
        env:
          NOTES_IOS_DE_BASE64: ${{ needs.prepare.outputs.notes_ios_de_base64 }}
          NOTES_IOS_EN_BASE64: ${{ needs.prepare.outputs.notes_ios_en_base64 }}
          NOTES_MACOS_DE_BASE64: ${{ needs.prepare.outputs.notes_macos_de_base64 }}
          NOTES_MACOS_EN_BASE64: ${{ needs.prepare.outputs.notes_macos_en_base64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-release-notes"
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" NOTES_IOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" NOTES_IOS_EN_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" NOTES_MACOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" NOTES_MACOS_EN_BASE64

      - name: Wait for Apple and submit both platforms
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The helper is absent before checkout and in release tags older than the helper.
          if [[ -f .github/scripts/release_failure.sh ]]; then
            source .github/scripts/release_failure.sh
          else
            release_fail() { echo "::error title=Apple release failed ($1)::$2 Remediation: $3"; exit 1; }
            retry_command() { while [[ "$1" != "--" ]]; do shift; done; shift; "$@"; }
          fi
          apple_log="$RUNNER_TEMP/apple-submit.log"
          if ! ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" 2>&1 | tee "$apple_log"; then
            release_fail app-store-connect \
              "App Store Connect build processing failed: $(tail -20 "$apple_log")" \
              "Confirm the builds exist and are valid in App Store Connect, then re-run after any Apple outage clears."
          fi
          if ! ruby .github/scripts/app_store_connect.rb prepare-app-store \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --localization "IOS:de-DE=$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" \
            --localization "IOS:en-US=$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" \
            --localization "MAC_OS:de-DE=$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" \
            --localization "MAC_OS:en-US=$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" \
            --create-versions \
            --automatic-release \
            --submit 2>&1 | tee -a "$apple_log"; then
            release_fail app-store-connect \
              "App Store submission failed: $(tail -20 "$apple_log")" \
              "Verify App Store Connect metadata and credentials, then re-run after any Apple outage clears."
          fi
