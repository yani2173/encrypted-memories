name: Issue triage

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Check duplicates and priority
    # Repo-global LLM kill switch: runs only when the LLM_ENABLED repository
    # variable is "1" or "true" (GitHub compares case-insensitively, so "True"
    # also enables it). Missing, "0", "false", or any other value skips this
    # job neutrally without failing.
    if: ${{ vars.LLM_ENABLED == '1' || vars.LLM_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted default-branch workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
        run: python3 .github/scripts/triage_issue.py
