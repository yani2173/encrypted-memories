name: Warm Apple dependency cache

on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/prepare-apple-build/action.yml"
      - "BuildSupport/**"
      - "Package.swift"
      - "Packages/**/Package.swift"
      - "Packages/**/Package.resolved"
      - "VendorPatches/**"
      - "project.yml"
      - "scripts/build-paths.sh"
      - "scripts/install-xcodegen.sh"
      - "scripts/update-proton-sdk.sh"
      - ".github/scripts/verify_xcode_toolchain.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  warm:
    name: Warm dependency cache
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-apple-build

      - if: always()
        run: bash ./scripts/report-build-storage.sh
