name: Prepare Apple build
description: Install pinned XcodeGen, restore the reviewed SDK, and generate the Xcode project.

inputs:
  sdk-version:
    description: Reviewed Proton Drive SDK tag.
    required: false
    default: "0.31.1"
  xcode-version:
    description: Xcode version that the build expects. A runner with another version fails.
    required: false
    default: "27.1"
  xcode-build:
    description: Reviewed Xcode build identifier. A runner with another build fails.
    required: false
    default: "27A9275"

  build-profile:
    description: Dependency graphs to prepare (app, package, or all).
    required: false
    default: all
  save-cache:
    description: Publish resolved dependencies after a cache miss.
    required: false
    default: "true"
  measure-cache:
    description: Restore the populated dependency cache again to measure its cost.
    required: false
    default: "false"

outputs:
  source-packages-path:
    description: Shared Xcode package checkout path.
    value: ${{ steps.build-paths.outputs.source-packages-path }}
  package-cache-path:
    description: Shared Xcode package cache path.
    value: ${{ steps.build-paths.outputs.package-cache-path }}

runs:
  using: composite
  steps:
    - name: Validate the build profile
      shell: bash
      env:
        BUILD_PROFILE: ${{ inputs.build-profile }}
      run: |
        set -euo pipefail
        case "$BUILD_PROFILE" in app|package|all) ;; *) echo "Invalid build profile." >&2; exit 64 ;; esac

    - name: Check the pinned Xcode version and build
      shell: bash
      env:
        DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        EXPECTED_XCODE_VERSION: ${{ inputs.xcode-version }}
        EXPECTED_XCODE_BUILD: ${{ inputs.xcode-build }}
      run: |
        set -euo pipefail
        bash .github/scripts/verify_xcode_toolchain.sh
        printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

    - name: Install pinned XcodeGen
      if: ${{ inputs.build-profile != 'package' }}
      shell: bash
      run: |
        set -euo pipefail
        executable="$(bash ./scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-install")"
        bin_dir="$(dirname "$executable")"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$executable" --version

    - name: Restore reviewed Proton Drive SDK
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        set -euo pipefail
        bash ./scripts/update-proton-sdk.sh "$SDK_VERSION"

    - name: Calculate dependency cache key
      id: dependency-cache-key
      shell: bash
      env:
        SDK_VERSION: ${{ inputs.sdk-version }}
      run: |
        set -euo pipefail
        source .github/scripts/release_failure.sh
        key_material="$RUNNER_TEMP/encrypted-memories-package-cache-inputs"
        : > "$key_material"
        while IFS= read -r file; do
          case "$file" in
            Package.swift|*/Package.swift|Package.resolved|*/Package.resolved|VendorPatches/*|project.yml|scripts/build-paths.sh|scripts/install-xcodegen.sh|scripts/update-proton-sdk.sh|.github/scripts/verify_xcode_toolchain.sh|.github/actions/prepare-apple-build/action.yml)
              shasum -a 256 "$file" >> "$key_material"
              ;;
          esac
        done < <(git ls-files)
        digest="$(shasum -a 256 "$key_material" | awk '{print $1}')"
        xcode_version_output="$(xcodebuild -version)"
        xcode_version="$(awk '/^Xcode / { print $2; exit }' <<< "$xcode_version_output")"
        xcode_build="$(awk '/^Build version / { print $3; exit }' <<< "$xcode_version_output")"
        [[ -n "$xcode_version" && -n "$xcode_build" ]] || release_fail toolchain \
          "xcodebuild -version did not report an Xcode version." \
          "Use the configured xcode-27 runner with a working Xcode installation."
        printf 'key=%s-sdk-%s-xcode-%s-package-cache-%s\n' \
          "$RUNNER_OS-$RUNNER_ARCH" "$SDK_VERSION" "$xcode_version-$xcode_build" "$digest" >> "$GITHUB_OUTPUT"

    - name: Restore SwiftPM dependencies
      id: spm-cache
      if: ${{ inputs.build-profile != 'app' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Developer/xcode/EncryptedMemories/SwiftPMCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-spm-v2

    - name: Restore Xcode dependencies
      id: xcode-cache
      if: ${{ inputs.build-profile != 'package' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Developer/xcode/EncryptedMemories/SourcePackages.noindex
          ~/Developer/xcode/EncryptedMemories/XcodePackageCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-xcode-v2

    - name: Export shared Xcode build paths
      id: build-paths
      shell: bash
      run: |
        set -euo pipefail
        source scripts/build-paths.sh
        {
          echo "source-packages-path=$ENCRYPTED_MEMORIES_XCODE_SOURCE_PACKAGES"
          echo "package-cache-path=$ENCRYPTED_MEMORIES_XCODE_PACKAGE_CACHE"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve the pinned SwiftPM graph
      if: ${{ inputs.build-profile != 'app' }}
      shell: bash
      run: |
        set -euo pipefail
        source scripts/build-paths.sh
        [[ -f Packages/EncryptedMemoriesKit/Package.resolved ]]
        [[ -f BuildSupport/Package.resolved ]]
        swift package \
          --package-path Packages/EncryptedMemoriesKit \
          --scratch-path "$ENCRYPTED_MEMORIES_SPM_SCRATCH" \
          --cache-path "$ENCRYPTED_MEMORIES_SWIFTPM_CACHE" \
          --force-resolved-versions \
          resolve
        git diff --exit-code -- Packages/EncryptedMemoriesKit/Package.resolved

    - name: Resolve the pinned Xcode graph
      if: ${{ inputs.build-profile != 'package' }}
      shell: bash
      run: |
        set -euo pipefail
        source scripts/build-paths.sh
        [[ -f BuildSupport/Package.resolved ]]
        xcodegen generate
        encryptedmemories_pin_generated_project_packages "$GITHUB_WORKSPACE"
        cmp \
          EncryptedMemories.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
          BuildSupport/Package.resolved
        cmp \
          EncryptedMemories.xcworkspace/xcshareddata/swiftpm/Package.resolved \
          BuildSupport/Package.resolved
        xcrun xcodebuild \
          -resolvePackageDependencies \
          -project EncryptedMemories.xcodeproj \
          -scheme EncryptedMemoriesMobile \
          -clonedSourcePackagesDirPath "$ENCRYPTED_MEMORIES_XCODE_SOURCE_PACKAGES" \
          -packageCachePath "$ENCRYPTED_MEMORIES_XCODE_PACKAGE_CACHE" \
          -packageAuthorizationProvider netrc \
          -onlyUsePackageVersionsFromResolvedFile

    - name: Save resolved SwiftPM dependencies
      if: ${{ inputs.save-cache != 'false' && inputs.build-profile != 'app' && steps.spm-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Developer/xcode/EncryptedMemories/SwiftPMCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-spm-v2

    - name: Save resolved Xcode dependencies
      if: ${{ inputs.save-cache != 'false' && inputs.build-profile != 'package' && steps.xcode-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Developer/xcode/EncryptedMemories/SourcePackages.noindex
          ~/Developer/xcode/EncryptedMemories/XcodePackageCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-xcode-v2

    - name: Measure populated SwiftPM cache restore
      if: ${{ inputs.measure-cache == 'true' && inputs.build-profile != 'app' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Developer/xcode/EncryptedMemories/SwiftPMCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-spm-v2
        fail-on-cache-miss: true

    - name: Measure populated Xcode cache restore
      if: ${{ inputs.measure-cache == 'true' && inputs.build-profile != 'package' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Developer/xcode/EncryptedMemories/SourcePackages.noindex
          ~/Developer/xcode/EncryptedMemories/XcodePackageCache.noindex
        key: ${{ steps.dependency-cache-key.outputs.key }}-xcode-v2
        fail-on-cache-miss: true
